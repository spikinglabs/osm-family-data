# Car parks from OpenStreetMap (Overpass only) →
# R2_PLACES_BUCKET/places/parking.jsonl, next to the places. Same towns as config/places.yaml.
name: Parking

on:
  # Monthly on the 22nd, a week after Toilets, so the jobs never ask Overpass at once.
  schedule:
    - cron: "30 1 22 * *"
  # Run workflow → tick the areas to refresh; none ticked refreshes all. The others keep
  # their rows as they are.
  workflow_dispatch:
    inputs:
      rhineland:
        description: Cologne, Düsseldorf, Bonn, Aachen and the Bergisches Land
        type: boolean
        default: false
      berlin:
        description: Berlin
        type: boolean
        default: false
      munich:
        description: Munich
        type: boolean
        default: false
      frankfurt:
        description: Frankfurt
        type: boolean
        default: false
      hamburg:
        description: Hamburg
        type: boolean
        default: false

concurrency:
  # Places, Toilets and Parking share one group: all ask the same public Overpass servers.
  group: osm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parking:
    runs-on: ubuntu-latest
    # About thirty small Overpass queries (one per square of at most 0.3 degrees; the Rhineland box
    # alone is 24), like Toilets. Each area is saved as it finishes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Fetch car parks
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PLACES_BUCKET: ${{ secrets.R2_PLACES_BUCKET }}
          RHINELAND: ${{ inputs.rhineland }}
          BERLIN: ${{ inputs.berlin }}
          MUNICH: ${{ inputs.munich }}
          FRANKFURT: ${{ inputs.frankfurt }}
          HAMBURG: ${{ inputs.hamburg }}
        run: |
          if [ -z "$R2_PLACES_BUCKET" ]; then
            echo "::notice::R2_PLACES_BUCKET not set; skipping parking."
            exit 0
          fi
          # One town per ticked area; the scheduled run has no inputs and refreshes all.
          towns=()
          [ "$RHINELAND" = true ] && towns+=(--town Köln)
          [ "$BERLIN" = true ] && towns+=(--town Berlin)
          [ "$MUNICH" = true ] && towns+=(--town München)
          [ "$FRANKFURT" = true ] && towns+=(--town "Frankfurt am Main")
          [ "$HAMBURG" = true ] && towns+=(--town Hamburg)
          out=$(uv run --frozen --no-dev osm-family-data parking --storage r2 "${towns[@]}" 2>&1) || { echo "$out"; echo "::error title=Parking::$(echo "$out" | tail -1 | cut -c1-600)"; exit 1; }
          echo "$out"; echo "::notice title=Parking::$(echo "$out" | tail -1)"
      # Job status for the DataHerb catalog (dataherb.status/v1), served at
      # https://places.allo.land/_dataherb/status/osm-parking/latest.json. Never fails the run.
      - name: Write DataHerb job status
        if: always()
        continue-on-error: true
        uses: DataHerb/dataherb-explorer/.github/actions/emit-status@main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        with:
          target: s3://${{ secrets.R2_PLACES_BUCKET }}/_dataherb/status/
          job-id: osm-parking
          status: ${{ job.status }}
          expected-interval: P1M
          datasets: osm-family-data
