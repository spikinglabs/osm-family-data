[project]
name = "osm-family-data"
version = "0.1.0"
description = "Family places, toilets, changing tables and drinking water from OpenStreetMap"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.scripts]
osm-family-data = "osm_family_data.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_family_data"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
